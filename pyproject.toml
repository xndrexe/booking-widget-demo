[project]
name = "booking-widget-demo"
version = "0.1.0"
description = "Бот записи с виджетом прямо в сообщении Telegram (Bot API 10.4)"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.9"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
